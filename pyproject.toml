[tool.poetry]
name = "umi_test_project"
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.12" 

[tool.poetry.dev-dependencies]
# 開発用の依存関係（例: linting tools, testing frameworks など）
pytest = "^7.0"
flake8 = "^6.0"
black = "^22.10.0"

[tool.poetry.extras]
# 追加の依存関係（例: "dev" など）
testing = ["pytest"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
